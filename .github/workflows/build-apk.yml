name: Build Stitch Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Inject Google Services Configuration
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
            echo "Injected production google-services.json from secret."
          else
            echo "Using default repository google-services.json configuration."
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Direct APK Binary
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/Stitch-Focus-Guard.apk
          echo "Direct APK ready: release_assets/Stitch-Focus-Guard.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stitch-Focus-Guard-Debug-APK
          path: release_assets/Stitch-Focus-Guard.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Stitch Focus Guard v1.0.0"
          body: |
            ### 🧵 Stitch — Peer Screen Time Manager
            
            Direct Android APK download (no unzipping needed):
            - **[Download Stitch-Focus-Guard.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Stitch-Focus-Guard.apk)**
            
            #### What's Included:
            - Real Android screen time tracking via `UsageStatsManager`
            - Floating focus shield overlay via `WindowManager` & `AccessibilityService`
            - Mutual focus pacts with friend approvals & 25 pushup challenge unlock
            - Calendar & smart routine auto-scheduler
            - Offline & hybrid local authentication fallback (no API key errors!)
          files: |
            release_assets/Stitch-Focus-Guard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
